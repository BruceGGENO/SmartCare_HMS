<html lang="en">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f0f7ff',
                100: '#e0effe',
                200: '#bae0fd',
                300: '#7cc5fb',
                400: '#36a5f7',
                500: '#0c87eb',
                600: '#0066cc',
                700: '#0052a3',
                800: '#034586',
                900: '#083a6f',
              },
              coral: {
                50: '#fff5f5',
                100: '#fed7d7',
                500: '#e53e3e',
                600: '#c53030',
              }

            boxShadow: {
              'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',

          }
        }
      }

    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        scroll-behavior: smooth;
      }
      /* Unified Dribbble-inspired card, table, and button polish across all workstation pages */
      main .rounded-2xl {
        border-radius: 1.5rem !important;
        box-shadow: 0 4px 20px -2px rgba(0, 52, 102, 0.05);
      }
      main table thead {
        background: linear-gradient(to right, #f8fafc, #f0f7ff);
      }
      main input, main select, main textarea {
        border-radius: 0.875rem !important;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased min-h-screen selection:bg-brand-500 selection:text-white">
